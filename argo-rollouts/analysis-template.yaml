apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-tests
  namespace: sa-p8
spec:
  metrics:
  - name: smoke-tests
    provider:
      job:
        spec:
          activeDeadlineSeconds: 30
          backoffLimit: 1
          template:
            spec:
              serviceAccountName: sa-microservice
              containers:
              - name: smoke-test
                image: curlimages/curl:latest
                command:
                - /bin/sh
                - -c
                - |
                  echo "Running smoke tests..."
                  curl -f http://gateway-service:8080/health || exit 1
                  echo "✓ Smoke tests passed"
              restartPolicy: Never
  - name: load-test
    provider:
      job:
        spec:
          activeDeadlineSeconds: 60
          backoffLimit: 1
          template:
            spec:
              serviceAccountName: sa-microservice
              containers:
              - name: load-test
                image: grafana/k6:latest
                env:
                - name: TARGET_URL
                  value: "http://gateway-service:8080"
                command:
                - k6
                - run
                - "-"
                args:
                - |
                  import http from 'k6/http';
                  import { check } from 'k6';
                  
                  export const options = {
                    vus: 5,
                    duration: '10s',
                  };
                  
                  export default function() {
                    let response = http.get(__ENV.TARGET_URL + '/health');
                    check(response, {
                      'status is 200': (r) => r.status === 200,
                      'latency < 500ms': (r) => r.timings.duration < 500,
                    });
                  }
              restartPolicy: Never
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: error-rate
spec:
  metrics:
  - name: error-rate
    interval: 30s
    failureLimit: 3
    successCondition: result[0] < 0.05
    provider:
      prometheus:
        address: http://prometheus:9090
        query: |
          rate(http_requests_total{status=~"5.."}[1m])