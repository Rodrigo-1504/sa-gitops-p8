apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.2.0
    helm:
      valuesObject:
        upgradeCRDs: false
        cleanUpCRDs: false
        deployNodeAgent: false
        credentials:
          useSecret: false
        serviceAccount:
          server:
            create: true
            name: velero
            annotations:
              iam.gke.io/gcp-service-account: velero@optical-realm-494617-m5.iam.gserviceaccount.com
        initContainers:
        - name: velero-plugin-for-gcp
          image: velero/velero-plugin-for-gcp:v1.14.4
          volumeMounts:
          - mountPath: /target
            name: plugins
        configuration:
          backupStorageLocation:
          - name: default
            provider: gcp
            bucket: optical-realm-494617-m5-velero-backups
            default: true
          volumeSnapshotLocation:
          - name: default
            provider: gcp
            config:
              project: optical-realm-494617-m5
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
        schedules:
          sa-p8-hourly:
            disabled: false
            schedule: "0 * * * *"
            template:
              ttl: 72h
              includedNamespaces: [sa-p8]
              excludedResources: [secrets]
              snapshotVolumes: true
              storageLocation: default
              volumeSnapshotLocations: [default]
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
