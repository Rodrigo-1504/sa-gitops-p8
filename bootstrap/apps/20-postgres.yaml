apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Rodrigo-1504/sa-gitops-p8.git
    targetRevision: main
    path: charts/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
