replicaCount: 1
image:
  repository: "202202854/sa-auth"
  tag: "latest"
service:
  type: ClusterIP
  port: 4000
jwtSecret: ""
dbPassword: ""
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
extraEnv:
  NODE_ENV: "development"
  LOG_LEVEL: "info"
  JWT_EXPIRES_IN: "24h"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "sa_platform"
  DB_USER: "sa_user"
