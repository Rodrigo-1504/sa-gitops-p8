apiVersion: v1
kind: Service
metadata:
  name: reservations-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: reservations
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
