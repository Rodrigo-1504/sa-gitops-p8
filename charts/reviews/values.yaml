replicaCount: 1
image:
  repository: "202202854/sa-resenas"
  tag: "0.0.0"
service:
  type: ClusterIP
  port: 4002
jwtSecret: ""
dbPassword: ""
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
extraEnv:
  NODE_ENV: "development"
  LOG_LEVEL: "info"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "sa_platform"
  DB_USER: "sa_user"
  DATABASE_URL: "postgresql://sa_user:postgres@sa-release-postgresql:5432/sa_platform"
